<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/src/assets/images/EgbaAlake.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link href="/src/style.css" rel="stylesheet">
  <title>Egbaalake Radio</title>
</head>

<body
  class="font-[Roboto] min-h-screen bg-[#0e1a0d] bg-[radial-gradient(circle_at_50%_0%,#2c5226_0%,#0e1a0d_62%)] text-[#f3ecd6] py-[1em] px-[1em] grid">
  <div class="app min-w-10/12 flex flex-col items-center gap-[5em]">
    <header class="flex justify-between items-center w-full">
      <h1>Egbaalake Radio</h1>
      <p>Live</p>
    </header>

    <div
      class="audio-card rounded-md w-full p-[1em] gap-[2em] flex flex-col justify-center items-center bg-linear-to-b from-[#0e1a0d] to-[#2c5226]">
      <audio class="max-w-[97%] hidden" controls>
        <source src="https://centova47.instainternet.com/proxy/egbaalak?mp=/stream" type="audio/mp3">
        Your browser does not support the audio element.
      </audio>
      <svg class="vinyl w-[65%]" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Spinning vinyl record">
        <defs>
          <!-- Round crop for the logo label -->
          <clipPath id="labelClip">
            <circle cx="100" cy="100" r="34" />
          </clipPath>

          <!-- Light reflection across the record -->
          <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset=".25" stop-color="#fff" stop-opacity=".12" />
            <stop offset=".5" stop-color="#fff" stop-opacity="0" />
            <stop offset=".75" stop-color="#fff" stop-opacity=".08" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
        </defs>

        <!-- Record body -->
        <circle cx="100" cy="100" r="98" fill="#111" />

        <!-- Grooves -->
        <g fill="none" stroke="#2a2a2a" stroke-width="1">
          <circle cx="100" cy="100" r="90" />
          <circle cx="100" cy="100" r="84" />
          <circle cx="100" cy="100" r="78" />
          <circle cx="100" cy="100" r="72" />
          <circle cx="100" cy="100" r="66" />
          <circle cx="100" cy="100" r="60" />
          <circle cx="100" cy="100" r="54" />
          <circle cx="100" cy="100" r="48" />
        </g>

        <!-- Track gap rings -->
        <circle cx="100" cy="100" r="69" fill="none" stroke="#000" stroke-width="2" opacity=".6" />
        <circle cx="100" cy="100" r="51" fill="none" stroke="#000" stroke-width="2" opacity=".6" />

        <!-- Shine -->
        <circle cx="100" cy="100" r="98" fill="url(#shine)" />

        <!-- Label: green base + logo -->
        <circle cx="100" cy="100" r="34" fill="#6fb352" />
        <image href="src/assets/images/EgbaAlake.jpg" x="66" y="66" width="68" height="68" clip-path="url(#labelClip)"
          preserveAspectRatio="xMidYMid slice" />
        <circle cx="100" cy="100" r="34" fill="none" stroke="#e8b84a" stroke-width="1.5" />

        <!-- Center hole -->
        <circle cx="100" cy="100" r="4" fill="#0e1a0d" />
      </svg>

      <svg class="play-icon" width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-label="Play">
        <defs>
          <radialGradient id="goldGrad" cx="35%" cy="30%" r="80%">
            <stop offset="0" stop-color="#f6d27a" />
            <stop offset="1" stop-color="#e8b84a" />
          </radialGradient>
        </defs>

        <!-- Outer ring -->
        <circle cx="40" cy="40" r="38" fill="none" stroke="#e8b84a" stroke-opacity=".35" stroke-width="2" />

        <!-- Button -->
        <circle cx="40" cy="40" r="33" fill="url(#goldGrad)" />

        <!-- Triangle (nudged right so it looks optically centered) -->
        <path d="M33 26 L56 40 L33 54 Z" fill="#0e1a0d" stroke="#0e1a0d" stroke-width="4" stroke-linejoin="round" />
      </svg>
    </div>
  </div>
  <script type="module" src="src/scripts/script.js"></script>
</body>

</html>
